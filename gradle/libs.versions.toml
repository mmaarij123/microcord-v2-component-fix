[versions]
agp = "9.2.1"
rxjava = "1.3.8"
junit = "4.13.2"
recyclerview = "1.4.0"
fresco = "3.7.0"

[libraries]
rxjava = { group = "io.reactivex", name = "rxjava", version.ref = "rxjava" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
recyclerview = { group = "androidx.recyclerview", name = "recyclerview", version.ref = "recyclerview" }
viewbinding = { group = "androidx.databinding", name = "viewbinding", version.ref = "agp" }
fresco-vito-view = { group = "com.facebook.fresco", name = "vito-view", version.ref = "fresco" }
fresco-vito-core = { group = "com.facebook.fresco", name = "vito-core", version.ref = "fresco" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
